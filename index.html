<!DOCTYPE html>
<html lang="ur"><head><meta charset="utf-8">

<style>
:root{--ink:#4a2f35;--out:#6b4a3a;--cream:#fffaf3;--rose:#f4a3bb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:linear-gradient(#fdf0ec,#f7dde2);font-family:'Jost',system-ui,sans-serif;color:var(--ink);touch-action:manipulation;color-scheme:light}
#S{position:fixed;inset:0;width:100%;height:100%;display:block}
#W{transition:transform 1.4s cubic-bezier(.5,0,.2,1)}
.hit{pointer-events:none}.hit.live{pointer-events:all;cursor:pointer}
.hit .tag,.hit .ring{opacity:0;transition:opacity .4s}.hit.live .tag,.hit.live .ring{opacity:1}
.ring{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:5 4;animation:dash 1s linear infinite;filter:drop-shadow(0 0 2px rgba(107,74,58,.7))}
@keyframes dash{to{stroke-dashoffset:-18}}
.pp{animation:pp .55s cubic-bezier(.3,1.7,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes pp{from{transform:scale(0)}}
.f{display:none}#catG[data-f=n] .fn,#catG[data-f=h] .fh,#catG[data-f=w] .fw,#catG[data-f=z] .fz,#catG[data-f=t] .ft,#catG[data-f=s] .fs{display:inline}
#bub{position:fixed;left:0;top:0;max-width:min(78vw,250px);padding:9px 15px;background:var(--cream);border:2px solid #7a4e57;border-radius:18px;box-shadow:0 3px 0 #efb9c6;font:italic 600 1.02rem/1.25 'Cormorant Garamond',Georgia,serif;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none;z-index:6}
#bub.on{opacity:1}
#bub::after{content:'';position:absolute;left:50%;bottom:-8px;width:13px;height:13px;background:var(--cream);border:2px solid #7a4e57;border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
#tick{position:fixed;left:0;top:0;width:50px;height:50px;border-radius:50%;border:2px solid #7a4e57;background:var(--cream);box-shadow:0 3px 0 #efb9c6;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:6;animation:bob 1.2s ease-in-out infinite}
#tick.on{display:flex}@keyframes bob{50%{transform:translateY(-4px)}}
#her{position:fixed;left:1vw;bottom:8px;height:min(36vh,300px);aspect-ratio:140/340;transform:translateY(115%);transition:transform 1s cubic-bezier(.3,1.25,.5,1);z-index:4;cursor:pointer}
#her.on{transform:translateY(0) rotate(-4deg);transform-origin:50% 100%}
#her svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 6px 8px rgba(107,74,58,.25))}
#hint{position:fixed;left:2vw;bottom:calc(min(36vh,300px) + 18px);padding:5px 13px;border-radius:99px;background:var(--cream);border:1.5px solid #7a4e57;font:italic 600 .95rem 'Cormorant Garamond',Georgia,serif;opacity:0;transition:opacity .5s;z-index:6;pointer-events:none}
#hint.on{opacity:1;animation:bob 1.4s ease-in-out infinite}
#ttl{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 40%,rgba(255,244,238,.94),rgba(247,214,222,.97));transition:opacity 1.1s;cursor:pointer;text-align:center;padding:20px}
#ttl b{font:italic 600 clamp(3.6rem,17vw,6.8rem)/1 'Cormorant Garamond',Georgia,serif;color:#6b3a47}
#ttl i{font:400 .78rem 'Jost',system-ui,sans-serif;letter-spacing:.34em;text-transform:uppercase;opacity:.75;font-style:normal}
#ttl u{margin-top:26px;text-decoration:none;font:italic 600 1.15rem 'Cormorant Garamond',Georgia,serif;animation:bob 1.6s ease-in-out infinite}
#again{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:none;padding:8px 22px;border-radius:99px;border:1.5px solid #7a4e57;background:var(--cream);font:italic 600 1.05rem 'Cormorant Garamond',Georgia,serif;cursor:pointer;z-index:6}
.prop{cursor:pointer;transform-box:fill-box;transform-origin:50% 100%}
.wob{animation:wob .65s ease-out}
@keyframes wob{20%{transform:rotate(-6deg) scale(1.05,.95)}45%{transform:rotate(5deg) scale(.97,1.04)}70%{transform:rotate(-2deg)}}
.steam{animation:rise 2.6s ease-out infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}30%{opacity:.8}100%{opacity:0;transform:translateY(-24px) scale(1.5)}}
.bellg{transform-box:fill-box;transform-origin:50% 0}
.ring-b{animation:bell 1s ease-out}
@keyframes bell{15%{transform:rotate(30deg)}35%{transform:rotate(-26deg)}55%{transform:rotate(17deg)}75%{transform:rotate(-9deg)}}
#catG[data-b="1"] .fn circle,#catG[data-b="1"] .fw circle{transform-box:fill-box;transform-origin:center;transform:scaleY(.12)}
.sgnw{animation:wob .7s ease-out;transform-box:fill-box;transform-origin:50% 0}
#bf{cursor:pointer}
.nm{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);width:min(86vw,320px);padding:18px 16px;background:var(--cream);border:2px solid #7a4e57;border-radius:22px;box-shadow:0 5px 0 #efb9c6;z-index:7;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.nm b{font:italic 600 1.25rem 'Cormorant Garamond',Georgia,serif}
.nm input{width:100%;padding:10px 14px;border-radius:99px;border:1.5px solid #7a4e57;background:#fff;font:500 1rem 'Jost',system-ui,sans-serif;color:var(--ink);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.chips i{font:400 .78rem 'Jost',system-ui,sans-serif;font-style:normal;padding:4px 11px;border-radius:99px;border:1.2px solid #e7a9b9;background:#fff5f7;cursor:pointer}
.go{border:0;border-radius:99px;padding:10px 28px;background:#7a4e57;color:#fffaf3;font:500 .95rem 'Jost',system-ui,sans-serif;letter-spacing:.04em;cursor:pointer}
.rc{position:fixed;left:50%;top:50%;width:min(84vw,310px);transform:translate(-50%,-50%) rotate(-2deg);padding:22px 20px 26px;background:#fffdf8;color:#4a2f35;font:500 .82rem/1.45 'Jost',system-ui,sans-serif;box-shadow:0 14px 34px rgba(107,74,58,.35);z-index:9;text-align:center;opacity:0;transition:opacity .9s;border-bottom:8px dotted #f2cdd6}
.rc.on{opacity:1}.rc h2{margin:0;font:italic 600 2.3rem/1 'Cormorant Garamond',Georgia,serif;color:#6b3a47}.rc small{letter-spacing:.3em;text-transform:uppercase;font-size:.62rem;opacity:.7}
.rc hr{border:0;border-top:1.5px dashed #d9b9c0;margin:11px 0}.rc .r{display:flex;justify-content:space-between;text-align:left;gap:10px}.rc em{display:block;font:italic 600 1rem/1.3 'Cormorant Garamond',Georgia,serif;margin:6px 0}
.rc .go{margin-top:12px}
.gm{position:fixed;inset:0;z-index:7;background:#fdf0ec;touch-action:none;user-select:none;-webkit-user-select:none}
.gm svg{position:absolute;inset:0;width:100%;height:100%}
.gh{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;justify-content:space-between;align-items:center;padding:0 16px;pointer-events:none}
.gh span{font:italic 600 1.15rem 'Cormorant Garamond',Georgia,serif;color:#6b3a47}
.gh b,.gh i{min-width:44px;text-align:center;padding:5px 12px;border-radius:99px;background:var(--cream);border:1.5px solid #7a4e57;font:500 .95rem 'Jost',system-ui,sans-serif;font-style:normal}
.gq{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);width:min(84vw,320px);text-align:center;padding:8px 14px;background:var(--cream);border:2px solid #7a4e57;border-radius:16px;font:italic 600 1rem/1.25 'Cormorant Garamond',Georgia,serif;pointer-events:none}
.gr{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(84vw,310px);padding:20px 16px;background:var(--cream);border:2px solid #7a4e57;border-radius:22px;box-shadow:0 5px 0 #efb9c6;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.gr b{font:italic 600 2rem/1 'Cormorant Garamond',Georgia,serif;color:#6b3a47}.gr i{font:italic 600 1.05rem/1.3 'Cormorant Garamond',Georgia,serif;font-style:italic}
.rs{font:500 .9rem 'Jost',system-ui,sans-serif}.rv{display:flex;gap:18px;align-items:center;justify-content:center;min-height:64px;font:italic 600 1.1rem 'Cormorant Garamond',Georgia,serif}
.rb{display:flex;gap:10px}.rbtn{width:76px;padding:8px 4px;border:1.5px solid #7a4e57;border-radius:16px;background:#fff;font:500 .7rem 'Jost',system-ui,sans-serif;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.drip{position:fixed;width:15px;height:21px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;border:2px solid #6b4a3a;z-index:10;box-shadow:inset -3px -3px 0 rgba(0,0,0,.08)}.drip::before{content:'';position:absolute;inset:-18px}
</style></head><body>
<svg id="S" viewBox="0 0 700 560" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern id="wR" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="skewY(26.565)"><rect width="12" height="12" fill="#e8b36b"/><path d="M0 0L12 12M12 0L0 12" stroke="#fbe3b3" stroke-width="1.7"/></pattern>
<pattern id="wL" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="skewY(-26.565)"><rect width="12" height="12" fill="#e8b36b"/><path d="M0 0L12 12M12 0L0 12" stroke="#fbe3b3" stroke-width="1.7"/></pattern>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f5"/><stop offset=".7" stop-color="#fff1d9"/></linearGradient></defs>
<g id="W"></g></svg>
<div id="bub"></div><div id="tick" aria-label="Aage chalo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7a4e57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
<div id="hint"></div><div id="her" aria-label="Tumhari ice cream"></div>
<div id="again">Dobara</div>
<div id="ttl"><i>ice cream &amp; co.</i><b>Floret</b><u>tap karo</u></div>
<script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
const sleep=ms=>new Promise(r=>setTimeout(r,ms*(window.FAST||1)));
const RN=a=>()=>{a=(a*16807)%2147483647;return a/2147483647};
const OUT='#6b4a3a',ox=350,oy=175,P=(x,y,z=0)=>[ox+(x-y)*32,oy+(x+y)*16-z];
const f1=n=>Math.round(n*10)/10,pts=a=>a.map(p=>f1(p[0])+','+f1(p[1])).join(' ');
const pl=(a,fill,sw=1.4,st=OUT,ex='')=>`<polygon points="${pts(a)}" fill="${fill}" stroke="${st}" stroke-width="${sw}" stroke-linejoin="round" ${ex}/>`;
const lp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
/* data */
const FL=[{n:'Strawberry Cream',c:'#f9b8c6',d:'#f1a0b3',fl:['#e8506b','#ffe3e8'],seed:3},{n:'Pistachio',c:'#bcd990',d:'#a8c878',fl:['#6f9a4a','#eef5c8'],seed:5},{n:'Mango',c:'#ffd37a',d:'#f4c05a',fl:['#f5a623','#fff1c4'],seed:7},{n:'Dark Chocolate',c:'#7a4d38',d:'#673f2e',fl:['#3a2318','#b58563'],seed:9},{n:'Vanilla Bean',c:'#fbecd0',d:'#efdbb6',fl:['#3a2a1d','#ffffff'],seed:11},{n:'Lavender Honey',c:'#cdbbee',d:'#b8a3df',fl:['#8d6fb3','#f3d58a'],seed:13}];
const CN=[{n:'Waffle',c:'#efbd72',d:'#c98f45',rim:'#e4a85c'},{n:'Sugar',c:'#f6e0b0',d:'#d9bd80',rim:'#ecd093'},{n:'Chocolate dipped',c:'#efbd72',d:'#c98f45',rim:'#7a4630',dip:1}];
const TP=[{n:'Strawberry',k:'st',c:'#e8465a'},{n:'Mango cubes',k:'mg',c:'#f7b32e'},{n:'Pistachio',k:'pi',c:'#8fb55a'},{n:'Choco cubes',k:'ch',c:'#6b3d29'},{n:'Whipped cream',k:'wc',c:'#fffaf5'},{n:'Wafer sticks',k:'wf',c:'#e8c58a'}];
/* ice cream (tip at 0,0; grows upward) */
function cube(x,y,w,t,l,r){return `<g stroke="${OUT}" stroke-width="1.3" stroke-linejoin="round"><polygon points="${x},${y} ${x-w},${y-w/2} ${x-w},${y-w/2-w} ${x},${y-w}" fill="${l}"/><polygon points="${x},${y} ${x+w},${y-w/2} ${x+w},${y-w/2-w} ${x},${y-w}" fill="${r}"/><polygon points="${x},${y-w} ${x+w},${y-w/2-w} ${x},${y-2*w} ${x-w},${y-w/2-w}" fill="${t}"/></g>`}
const TD={
st:(x,y)=>`<g transform="translate(${x} ${y})"><path d="M0 0C-13-5-15-20-7-25C-3-27 0-24 0-24C0-24 3-27 7-25C15-20 13-5 0 0Z" fill="#e8465a" stroke="${OUT}" stroke-width="1.6"/><path d="M0-4C-8-8-9-17-4-20C-1-21 0-19 0-19C0-19 1-21 4-20C9-17 8-8 0-4Z" fill="#f9a3ad"/><g fill="#ffe08a"><ellipse cx="-4" cy="-14" rx="1" ry="1.5"/><ellipse cx="4" cy="-14" rx="1" ry="1.5"/><ellipse cx="0" cy="-9" rx="1" ry="1.5"/><ellipse cx="-7" cy="-19" rx="1" ry="1.4"/><ellipse cx="7" cy="-19" rx="1" ry="1.4"/></g><path d="M-8-25L-4-31L-1-26L2-33L5-26L9-30L8-24Z" fill="#6fa14a" stroke="${OUT}" stroke-width="1.2" stroke-linejoin="round"/></g>`,
mg:(x,y)=>`<g transform="translate(${x} ${y})">${cube(0,-10,9,'#ffe07a','#f7b32e','#e99a1a')}${cube(-9,-2,9,'#ffe07a','#f7b32e','#e99a1a')}${cube(9,-3,9,'#ffd04f','#f2a81d','#df8f12')}</g>`,
ch:(x,y)=>`<g transform="translate(${x} ${y})">${cube(0,-10,9,'#9a6347','#7a4a33','#5e3623')}${cube(-9,-2,9,'#9a6347','#7a4a33','#5e3623')}${cube(9,-3,9,'#8a563b','#6d412c','#52301f')}</g>`,
wc:(x,y)=>`<g transform="translate(${x} ${y})" stroke="${OUT}" stroke-width="1.6" stroke-linejoin="round"><ellipse cx="0" cy="-3" rx="19" ry="8" fill="#fffaf5"/><ellipse cx="0" cy="-11" rx="14" ry="7" fill="#fffaf5"/><path d="M-8-13Q0-30 6-16Q8-20 0-26" fill="#fffaf5"/><path d="M-10-11Q-2-8 8-12M-14-3Q0 2 14-3" fill="none" stroke="#e9cfcf" stroke-width="1.4"/></g>`,
wf:(x,y)=>[[-22,'#e8c58a'],[16,'#efd29c']].map(([a,c])=>`<g transform="translate(${x} ${y}) rotate(${a})"><rect x="-4" y="-60" width="9" height="62" rx="2.5" fill="${c}" stroke="${OUT}" stroke-width="1.4"/><path d="M-4-52L5-46M-4-40L5-34M-4-28L5-22M-4-16L5-10" stroke="#c9975a" stroke-width="1.2"/></g>`).join('')};
function pistachio(cy,r){let o='';for(let i=0;i<16;i++){const x=(r()-.5)*56,y=cy-32+r()*24;o+=`<rect x="${f1(x)}" y="${f1(y)}" width="${f1(3+r()*3)}" height="${f1(2.5+r()*2)}" rx="1" transform="rotate(${f1(r()*180)} ${f1(x)} ${f1(y)})" fill="${['#8fb55a','#bcd47a','#6f9a4a'][i%3]}" stroke="#4d6b32" stroke-width=".7"/>`}return o}
function scoopSvg(f,cy,m,b,fresh){const r=RN(f.seed);let o=`<g class="${fresh?'pp':''}"><mask id="${m}" maskUnits="userSpaceOnUse" x="-80" y="${cy-70}" width="160" height="130"><rect x="-80" y="${cy-70}" width="160" height="130" fill="#fff"/>${b>=1?`<circle cx="30" cy="${cy-4}" r="15" fill="#000"/>`:''}${b>=2?`<circle cx="-27" cy="${cy-12}" r="16" fill="#000"/>`:''}</mask><g mask="url(#${m})">`;
o+=`<path d="M-38 ${cy+20}C-45 ${cy-8} -30 ${cy-34} 0 ${cy-34}C30 ${cy-34} 45 ${cy-8} 38 ${cy+20}Z" fill="${f.c}" stroke="${OUT}" stroke-width="2.2" stroke-linejoin="round"/>`;
o+=`<path d="M30 ${cy-22}Q42 ${cy-4} 37 ${cy+17}Q29 ${cy+4} 30 ${cy-22}Z" fill="#000" opacity=".08"/>`;
for(let i=0;i<24;i++){const x=(r()-.5)*62,y=cy-26+r()*38;if(Math.abs(x)<36-(y-cy+30)*.05)o+=`<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(1+r()*2)}" ry="${f1(.8+r()*1.4)}" transform="rotate(${f1(r()*180)} ${f1(x)} ${f1(y)})" fill="${f.fl[i%2]}" opacity=".85"/>`}
o+=`<path d="M-27 ${cy-4}Q-12 ${cy-12} 8 ${cy-5}M-30 ${cy+6}Q-8 ${cy-2} 24 ${cy+4}" stroke="#000" stroke-opacity=".1" stroke-width="2" fill="none" stroke-linecap="round"/>`;
for(let i=0;i<9;i++){const x=-34+i*8.5;o+=`<circle cx="${f1(x)}" cy="${f1(cy+20+(i%2?2:-1))}" r="8.6" fill="${f.d}" stroke="${OUT}" stroke-width="1.9"/>`}
o+=`<path d="M-23 ${cy-12}Q-19 ${cy-26} -4 ${cy-29}" stroke="#fff" stroke-opacity=".7" stroke-width="4.5" fill="none" stroke-linecap="round"/><circle cx="-26" cy="${cy-3}" r="2.2" fill="#fff" opacity=".7"/>`;
return o+'</g></g>'}
function IC(s,p){const cn=s.cone,n=s.sc.length;let o=`<defs><clipPath id="${p}cc"><polygon points="-30,-122 30,-122 0,0"/></clipPath><clipPath id="${p}sc"><polygon points="-19,-72 19,-72 0,3"/></clipPath></defs>`;
o+=`<g clip-path="url(#${p}cc)"><rect x="-32" y="-124" width="64" height="126" fill="${cn.c}"/>`;
for(let i=-6;i<8;i++)o+=`<path d="M${i*12-40} -124L${i*12+30} 6M${i*12+40} -124L${i*12-30} 6" stroke="${cn.d}" stroke-width="2.4" fill="none"/>`;
if(cn.dip)o+=`<path d="M-34-124H34V-86Q28-78 22-88Q16-74 10-86Q4-72-2-86Q-8-74-14-86Q-22-76-28-88Q-31-82-34-86Z" fill="#6a3f2c"/>`;
o+=`</g><polygon points="-30,-122 30,-122 0,0" fill="none" stroke="${OUT}" stroke-width="2.4" stroke-linejoin="round"/><rect x="-34" y="-131" width="68" height="14" rx="6" fill="${cn.rim}" stroke="${OUT}" stroke-width="2.2"/>`;
o+=`<polygon points="-19,-72 19,-72 0,3" fill="#fff6f2"/><g clip-path="url(#${p}sc)" fill="#f7b6c8">${[-16,-8,0,8,16].map(x=>`<rect x="${x-2}" y="-76" width="4" height="82"/>`).join('')}</g><polygon points="-19,-72 19,-72 0,3" fill="none" stroke="${OUT}" stroke-width="2.2" stroke-linejoin="round"/>`;
[-15,-5,5,15].forEach(x=>o+=`<circle cx="${x}" cy="-72" r="5.4" fill="#ffe0e8" stroke="${OUT}" stroke-width="1.8"/>`);
s.sc.forEach((f,i)=>{const cy=-152-i*50;if((s.bites[i]||0)<3)o+=scoopSvg(f,cy,p+'m'+i,s.bites[i]||0,s.fresh==='s'+i)});
const ti=n-1,cy=-152-ti*50;
if(n&&(s.bites[ti]||0)<1&&s.tp.length){const r=RN(21),sl=[[-13,cy-26],[14,cy-29],[0,cy-41]];
const order=['wf','wc','ch','mg','st','pi'];[...s.tp].sort((a,b)=>order.indexOf(a.k)-order.indexOf(b.k)).forEach(t=>{const i=s.tp.indexOf(t),pos=sl[i%3];o+=`<g class="${s.fresh==='t'+i?'pp':''}">${t.k=='pi'?pistachio(cy,r):TD[t.k](pos[0],pos[1])}</g>`})}
if(s.gold&&n){const y1=-152-(n-1)*50-30;o+=`<g class="pp"><path d="M-26 ${y1-10}Q-20 ${y1-30} -8 ${y1-34}" stroke="${OUT}" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="-26" cy="${y1}" r="11" fill="#ffd24a" stroke="${OUT}" stroke-width="2"/><path d="M-32 ${y1-4}Q-30 ${y1-9} -25 ${y1-9}" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M-10 ${y1-14}l2 5l5 1l-4 3l1 5l-4-3l-4 3l1-5l-4-3l5-1z" fill="#fff" stroke="${OUT}" stroke-width="1"/></g>`}
if(s.name&&n){const f=s.name.replace(/[<>&]/g,'').slice(0,12),y0=-152-(n-1)*50;o+=`<g><path d="M24 ${y0+8}L40 ${y0-64}" stroke="${OUT}" stroke-width="2.2" stroke-linecap="round"/><path d="M40 ${y0-64}h46l-6 10l6 10h-46z" fill="#fffaf3" stroke="${OUT}" stroke-width="1.8" stroke-linejoin="round"/><text x="60" y="${y0-50}" text-anchor="middle" font-family="Jost,system-ui,sans-serif" font-size="8.5" font-weight="500" fill="#4a2f35">${f}</text></g>`}
